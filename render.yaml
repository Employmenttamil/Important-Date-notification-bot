services:
  - type: web
    name: exam-date-bot
    runtime: python
    pythonVersion: "3.11"
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SCRAPE_INTERVAL_MINUTES
        value: "30"
      - key: FLASK_DEBUG
        value: "False"
      - key: LOG_LEVEL
        value: "INFO"
